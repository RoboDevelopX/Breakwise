name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[ai,dev]"
      - run: python -m pytest

  # Run the action from this checkout against the bundled demo project, so a broken
  # action.yml fails CI instead of failing for users.
  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: breakwise
        uses: ./
        with:
          path: examples/python-demo
          mode: scan
          comment: "false"
      - name: The demo project must report its known breaking change
        env:
          BREAKING: ${{ steps.breakwise.outputs.breaking }}
        run: |
          echo "breaking=${BREAKING}"
          test "${BREAKING}" -ge 1
